<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wonderloop Studios</title>
<meta name="description" content="Wonderloop Studios — an independent game studio. Site under construction." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<style>
  :root {
    --bg-0: #0b0b14;
    --bg-1: #12121f;
    --accent-1: #7c5cff;
    --accent-2: #22e5c8;
    --accent-3: #ff5fa2;
    --text-0: #f5f5fa;
    --text-1: #a8a8bd;
    --border: rgba(255, 255, 255, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    color: var(--text-0);
    background: radial-gradient(circle at 20% 20%, #1c1633 0%, transparent 45%),
                radial-gradient(circle at 80% 30%, #0f2a2a 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, #2a1330 0%, transparent 55%),
                var(--bg-0);
    overflow-x: hidden;
    padding: 2rem 1.25rem;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .glow-1 { width: 480px; height: 480px; background: var(--accent-1); top: -120px; left: -120px; }
  .glow-2 { width: 420px; height: 420px; background: var(--accent-2); bottom: -140px; right: -100px; }

  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(8px);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-1);
  }

  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px var(--accent-2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }

  .loop-icon {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--accent-1);
    border-right-color: var(--accent-2);
    animation: spin 2.4s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--accent-2), var(--accent-1) 55%, var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lead {
    margin: 0;
    color: var(--text-1);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 480px;
  }

  .construction {
    font-size: 0.95rem;
    color: var(--text-1);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.9rem;
    width: 100%;
  }

  .link-card {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.75rem 1.25rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-0);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    backdrop-filter: blur(6px);
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--icon-color, var(--accent-1));
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 8px 24px -8px var(--icon-color, var(--accent-1));
  }

  .link-card svg {
    width: 20px;
    height: 20px;
    fill: var(--icon-color, var(--text-0));
    flex-shrink: 0;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 3rem;
    color: var(--text-1);
    font-size: 0.8rem;
    text-align: center;
  }

  @media (max-width: 480px) {
    .link-card { flex: 1 1 45%; justify-content: center; }
  }
</style>
</head>
